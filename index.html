<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>SDS Command Center</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1a1f2e;
    --muted: #6b7280;
    --border: #e2e6ee;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .gate {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 2px 12px rgba(15,23,42,0.06);
  }
  h1 {
    margin: 0 0 6px 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 22px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type=password] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    transition: border-color 0.15s;
  }
  input[type=password]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    margin-top: 14px;
    padding: 11px 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .error {
    margin-top: 12px;
    color: var(--error);
    font-size: 12px;
    min-height: 18px;
    text-align: center;
  }
  .working {
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <h1>SDS Command Center</h1>
  <div class="sub">Enter password to view the dashboard.</div>
  <form id="gateForm" autocomplete="off">
    <label for="pw">Password</label>
    <input type="password" id="pw" autofocus autocomplete="current-password" />
    <button type="submit" id="submitBtn">Unlock</button>
    <div class="error" id="error"></div>
  </form>
</div>

  const CACHE_KEY = "sds-cc-pw-cache-v1";
  const CACHE_DAYS = 30;

  function b64(s) {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: PAYLOAD.iterations, hash: "SHA-256" },
      baseKey,
      { name: "AES-CBC", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function tryDecryptVerifier(password) {
    const salt = b64(PAYLOAD.salt);
    const vIv = b64(PAYLOAD.verifier_iv);
    const vCt = b64(PAYLOAD.verifier_ct);
    const key = await deriveKey(password, salt);
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: vIv }, key, vCt);
      const txt = new TextDecoder().decode(plain);
      return (txt === "sds-cc-v1") ? key : null;
    } catch (e) {
      return null;
    }
  }

  async function decryptBody(key) {
    const iv = b64(PAYLOAD.iv);
    const ct = b64(PAYLOAD.ciphertext);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, key, ct);
    return new TextDecoder().decode(plain);
  }

  function renderHtml(htmlText) {
    // Replace the entire document with the decrypted content.
    document.open();
    document.write(htmlText);
    document.close();
  }

  function readCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (Date.now() > obj.expiresAt) {
        localStorage.removeItem(CACHE_KEY);
        return null;
      }
      return obj.password;
    } catch (e) { return null; }
  }

  function writeCache(password) {
    const expiresAt = Date.now() + CACHE_DAYS * 24 * 60 * 60 * 1000;
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ password, expiresAt })); } catch (e) {}
  }

  async function attempt(password, saveCache) {
    const key = await tryDecryptVerifier(password);
    if (!key) return false;
    const html = await decryptBody(key);
    if (saveCache) writeCache(password);
    renderHtml(html);
    return true;
  }

  // On load: try cached password silently.
  (async () => {
    const cached = readCache();
    if (cached) {
      const ok = await attempt(cached, false);
      if (ok) return;
      // cached password no longer works (e.g. password rotated) — clear and prompt
      localStorage.removeItem(CACHE_KEY);
    }
  })();

  // Form submission
  document.getElementById("gateForm").addEventListener("submit", async function(e) {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    const btn = document.getElementById("submitBtn");
    const err = document.getElementById("error");
    err.textContent = "";
    if (!pw) return;
    btn.disabled = true;
    btn.textContent = "Unlocking…";
    err.classList.add("working");
    err.textContent = "Deriving key…";
    try {
      const ok = await attempt(pw, true);
      if (!ok) {
        err.classList.remove("working");
        err.textContent = "Incorrect password.";
        btn.disabled = false;
        btn.textContent = "Unlock";
        document.getElementById("pw").select();
      }
    } catch (ex) {
      err.classList.remove("working");
      err.textContent = "Decryption failed: " + (ex && ex.message ? ex.message : String(ex));
      btn.disabled = false;
      btn.textContent = "Unlock";
    }
  });
})();
